name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Emits base_path, which is "/<repo>" for a project site and "" for a
      # custom domain. Feeding it to next.config.mjs keeps both cases working.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static export
        env:
          # base_path is "/<repo>" for a project site, "" for a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute deployment URL, so canonical tags and share images resolve.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Search engines stay out until this sits on the Herald's own domain.
          NEXT_PUBLIC_ALLOW_INDEXING: "false"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
