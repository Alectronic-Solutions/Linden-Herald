name: CI

# Nothing ran on a pull request before this. A change could be merged to main
# and deployed without a single automated check having looked at it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, validate, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts is committed, so this works on a fresh clone with no build.
      - name: Typecheck
        run: npm run typecheck

      - name: Validate src/data
        run: npm run validate

      - name: Build static export
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: "false"
        run: npm run build

      - name: Check the exported HTML
        run: |
          set -e
          # One <h1> per page. The masthead was promoted to h1 on the home page
          # while the page rendered its own, so / shipped two.
          fail=0
          while IFS= read -r page; do
            n=$(grep -o '<h1' "$page" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error file=$page::expected 1 <h1>, found $n"
              fail=1
            fi
          done < <(find out -name index.html)

          # The archive list must be in the static HTML. It used to ship as 32
          # elements with inline opacity:0, so the page was blank without JS.
          cards=$(grep -o 'href="/archive/20' out/archive/index.html | wc -l)
          if [ "$cards" -lt 30 ]; then
            echo "::error::archive page has $cards issue links in static HTML, expected 30+"
            fail=1
          fi
          if grep -q 'opacity:0' out/archive/index.html; then
            echo "::error::archive page ships inline opacity:0 again"
            fail=1
          fi

          # Every page needs its own canonical. Five pages inherited the root's
          # canonical of "/" and told search engines they were duplicates.
          while IFS= read -r page; do
            if ! grep -q '<link rel="canonical"' "$page"; then
              echo "::error file=$page::no canonical"
              fail=1
            fi
          done < <(find out -name index.html -not -path 'out/404*')

          exit $fail

      - name: Upload the export
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
          retention-days: 7

  e2e:
    name: Accessibility, no-JS and metadata
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: "false"
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # axe-core on all 20 routes, one <h1> per page, a canonical per page,
      # and the whole site rendered with JavaScript disabled.
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  budget:
    name: JavaScript budget
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # framer-motion sat in the root layout chunk and cost every one of the
      # twenty routes 37 KB gzipped. This is the tripwire for that coming back.
      - name: Check shared JS stays under budget
        run: npm run budget
