# Lets the newsroom (and us) hand work to Claude from an issue or a PR by
# mentioning @claude. Pairs with the issue templates in .github/ISSUE_TEMPLATE
# and the project skills in .claude/skills.
#
# DORMANT until someone sets a credential. With no secret configured this
# workflow skips with a note instead of failing, so it costs nothing and traps
# nobody. Every other workflow in this repo is free: Actions minutes are
# unmetered on public repositories.
#
# To switch it on you need two things:
#
#   1. The Claude GitHub App installed on this repository.
#      https://github.com/apps/claude  ->  Install  ->  Linden-Herald
#
#   2. ONE of these repository secrets
#      (Settings -> Secrets and variables -> Actions):
#
#      CLAUDE_CODE_OAUTH_TOKEN  Uses an existing Claude Pro/Max subscription.
#                               No separate bill; it draws on that plan's
#                               limits. Generate with: claude setup-token
#
#      ANTHROPIC_API_KEY        Pay-per-token API billing from
#                               console.anthropic.com, separate from any Claude
#                               subscription. Every @claude mention is charged.
#
# Prefer the OAuth token if you already pay for Claude. Delete this file if you
# would rather not have the option at all.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # The secrets context is not allowed in an `if:`, so it is resolved here.
      HAS_CREDENTIAL: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') && 'yes' || 'no' }}
    steps:
      - name: Report that Claude is not configured
        if: env.HAS_CREDENTIAL != 'yes'
        run: |
          echo "::notice::@claude is not set up on this repository. See the" \
               "comments at the top of .github/workflows/claude.yml. Skipping."

      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIAL == 'yes'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CREDENTIAL == 'yes'
        with:
          # Whichever one is set. The OAuth token draws on a Claude
          # subscription; the API key bills per token.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Everything the checks need, so Claude can verify its own work.
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm run check),Bash(npm run build),Bash(npm run validate),Bash(npm run validate:fix),Bash(npm run lint),Bash(npm run typecheck)"
