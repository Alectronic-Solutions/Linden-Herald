# Lets the newsroom (and us) hand work to Claude from an issue or a PR by
# mentioning @claude. Pairs with the issue templates in .github/ISSUE_TEMPLATE
# and the project skills in .claude/skills.
#
# Requires: the Claude GitHub App installed on this repository, and an
# ANTHROPIC_API_KEY repository secret. Run /install-github-app in Claude Code.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Everything the checks need, so Claude can verify its own work.
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm run check),Bash(npm run build),Bash(npm run validate),Bash(npm run validate:fix),Bash(npm run lint),Bash(npm run typecheck)"
